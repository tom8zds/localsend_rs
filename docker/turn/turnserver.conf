# coturn configuration for the localsend relay.
#
# coturn speaks full RFC 8656 + RFC 6062 (TURN-over-TCP), relaying to
# arbitrary peer addresses — which turn-rs cannot (its permissions
# only cover peers that are themselves clients of the same server).
#
# This file is the LOCAL TESTING template: `allow-loopback-peers`
# and the well-known test secret are for integration tests against
# 127.0.0.1 only. For production copy this to turnserver.prod.conf
# and follow the checklist in README.md.

listening-port=3478
listening-ip=0.0.0.0

# Behind NAT/docker, set to the public address clients dial in on.
# Irrelevant to the 6062 data path; only affects advertisements.
external-ip=198.51.100.1

realm=localsend
server-name=localsend-relay

# draft-uberti REST credentials, same scheme as the CLI's
# `relay-credential` subcommand:
#   username = "<expiry-unix>:<suffix>"
#   password = base64(HMAC-SHA1(secret, username))
use-auth-secret
static-auth-secret=localsend-relay-test-secret

# --- testing-only relaxation (loopback peers) ---
allow-loopback-peers

simple-log

# --- admin panel integration (relay-panel) ---
# Telnet admin CLI on loopback of the compose network; consumed by
# the panel container. Plain password here (test deployment).
cli-ip=127.0.0.1
cli-port=5766
cli-password=$5$d2a72d7634988731$c4c91b1ee49e972b288d8354d297e057a72a97211547e3ac5baa5ef9db7e6a6e
# Prometheus metrics for the panel scraper.
prometheus
prometheus-port=9641
