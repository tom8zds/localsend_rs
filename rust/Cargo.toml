[workspace]
resolver = "2"
members = ["core", "ffi", "cli"]

[workspace.dependencies]
localsend_core = { path = "core" }

flutter_rust_bridge = "=2.12.0"
axum = "0.8.9"
rand = "0.9.5"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures = "0.3.34"
log = "0.4.33"
lazy_static = "1.5.0"
simplelog = "0.12.2"
pin-project-lite = "0.2.17"
uuid = { version = "1.24.1", features = ["v4"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
ureq = "2.10.1"
socket2 = "0.6.5"
parking_lot = "0.12.5"
once_cell = "1.21.4"
tempfile = "3.20.0"
