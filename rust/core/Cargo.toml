[package]
name = "localsend_core"
version = "1.0.1"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
pin-project-lite = { workspace = true }
reqwest = { workspace = true }
hmac = "0.13.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14.9"
pem = "4.0.0"
sha2 = "0.11.0"
if-addrs = "0.15.0"
socket2 = "0.6.5"
quinn = { version = "0.11.11", default-features = false, features = ["rustls", "runtime-tokio"] }
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
tower = "0.5.3"
hyper-util = { version = "0.1.20", features = ["http1", "client-legacy"] }
http = "1.5.0"

[dev-dependencies]
axum.workspace = true
env_logger = "0.11.11"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
