name: Build Abi for Android

on:
  workflow_dispatch:

  workflow_call:


jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Set up Android NDK and Cargo toolchain for cross-compiling to Android
    - name: Set up environment
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi

    # Download Android NDK for cross-compiling
    - name: Download Android NDK
      uses: nttld/setup-ndk@v1.5.0
      with:
        # Exact version to use
        ndk-version: r26d
        local-cache: true

    - name: Setup cargo ndk
      run: |
        cargo install cargo-ndk
        rustup target list --installed

    # Build only the FFI crate (the one the app loads); the workspace
    # also hosts the CLI, which has no business being cross-compiled
    # to Android.
    - name: Build
      run: |
        mkdir output
        cargo ndk -o ./output -t arm64-v8a -t armeabi-v7a --manifest-path ./ffi/Cargo.toml build --release
        ls ./output

    # Upload the built artifacts as an artifact
    - name: Upload Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: android-abi-arm
        path: rust/output
