name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'refactor/**'

jobs:
    build-apk:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.16.0
              with:
                  channel: stable
                  cache: false

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

            - name: Set up java 17
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu" # See "Supported distributions" for available options.
                  java-version: "17"

            - name: Build Prepare
              run: |
                  flutter pub get
                  flutter doctor -v

            - name: Build APK
              run: |
                  flutter build apk
                  ls -alh ./build/app/outputs/flutter-apk/*.apk
                  cp -r ./build/app/outputs/flutter-apk /tmp/flutter-apk

            - name: Upload Android
              uses: actions/upload-artifact@v4.3.3
              with:
                  name: android-release
                  path: /tmp/flutter-apk/*.apk

    build-windows:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.16.0
              with:
                  channel: stable
                  cache: true

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            # setup.dart shells out to `iscc` (package:innosetup).
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y

            - name: Build Prepare
              run: flutter pub get

            - name: Build Windows
              run: |
                  flutter build windows --release

            - name: Build iss script
              run: |
                  dart setup.dart
                  ls build\windows

            - name: Upload Windows
              uses: actions/upload-artifact@v4.3.3
              with:
                  name: windows-release
                  path: build\windows\localsend_rs-setup.exe
