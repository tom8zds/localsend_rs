name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'refactor/**'
            - 'feat/**'
            - 'fix/**'

jobs:
    build-apk:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.23.0
              with:
                  channel: stable
                  cache: false

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

            - name: Set up java 17
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu" # See "Supported distributions" for available options.
                  java-version: "17"

            - name: Build Prepare
              run: |
                  flutter pub get
                  flutter doctor -v

            - name: Build APK
              run: |
                  flutter build apk
                  ls -alh ./build/app/outputs/flutter-apk/*.apk
                  cp -r ./build/app/outputs/flutter-apk /tmp/flutter-apk

            - name: Upload Android
              uses: actions/upload-artifact@v5
              with:
                  name: android-release
                  path: /tmp/flutter-apk/*.apk

    build-linux:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.23.0
              with:
                  channel: stable
                  cache: false

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            # flutter's linux desktop needs the GTK dev headers; the
            # hosted runner ships everything else (clang, cmake,
            # ninja, pkg-config).
            - name: Install GTK dev packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-3-dev

            - name: Build Prepare
              run: flutter pub get

            - name: Build Linux
              run: flutter build linux --release

            - name: Bundle
              run: |
                  tar czf build/linux/localsend_rs-linux-x64.tar.gz -C build/linux/x64/release/bundle .

            - name: Upload Linux
              uses: actions/upload-artifact@v5
              with:
                  name: linux-release
                  path: build/linux/localsend_rs-linux-x64.tar.gz

    build-cli:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./rust

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up rust (musl static)
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-linux-musl

            - name: Install musl toolchain
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

            - name: Build CLI (musl static)
              run: cargo build --release --target x86_64-unknown-linux-musl -p localsend-cli
              env:
                  CC_x86_64_unknown_linux_musl: musl-gcc
                  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc

            - name: Upload CLI
              uses: actions/upload-artifact@v5
              with:
                  name: localsend-cli-linux-musl
                  path: rust/target/x86_64-unknown-linux-musl/release/localsend-cli

    build-windows:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.23.0
              with:
                  channel: stable
                  cache: true

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            # setup.dart shells out to `iscc` (package:innosetup).
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y

            - name: Build Prepare
              run: flutter pub get

            - name: Build CLI (Windows)
              run: cargo build --release -p localsend-cli
              working-directory: ./rust

            - name: Build Windows
              run: |
                  flutter build windows --release

            - name: Build iss script
              run: |
                  dart setup.dart
                  ls build\windows

            - name: Upload Windows
              uses: actions/upload-artifact@v5
              with:
                  name: windows-release
                  path: build\windows\localsend_rs-setup.exe

            - name: Upload CLI (Windows)
              uses: actions/upload-artifact@v5
              with:
                  name: localsend-cli-windows-x64
                  path: rust/target/release/localsend-cli.exe
