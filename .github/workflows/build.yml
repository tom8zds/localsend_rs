name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'refactor/**'
            - 'feat/**'
            - 'fix/**'

jobs:
    build-apk:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.16.0
              with:
                  channel: stable
                  cache: false

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

            - name: Set up java 17
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu" # See "Supported distributions" for available options.
                  java-version: "17"

            - name: Build Prepare
              run: |
                  flutter pub get
                  flutter doctor -v

            - name: Build APK
              run: |
                  flutter build apk
                  ls -alh ./build/app/outputs/flutter-apk/*.apk
                  cp -r ./build/app/outputs/flutter-apk /tmp/flutter-apk

            - name: Upload Android
              uses: actions/upload-artifact@v5
              with:
                  name: android-release
                  path: /tmp/flutter-apk/*.apk

    build-linux:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.16.0
              with:
                  channel: stable
                  cache: false

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            # flutter's linux desktop needs the GTK dev headers; the
            # hosted runner ships everything else (clang, cmake,
            # ninja, pkg-config).
            - name: Install GTK dev packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-3-dev

            - name: Build Prepare
              run: flutter pub get

            - name: Build Linux
              run: flutter build linux --release

            - name: Bundle
              run: |
                  tar czf build/linux/localsend_rs-linux-x64.tar.gz -C build/linux/x64/release/bundle .

            - name: Upload Linux
              uses: actions/upload-artifact@v5
              with:
                  name: linux-release
                  path: build/linux/localsend_rs-linux-x64.tar.gz

    build-cli:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./rust

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            - name: Build CLI
              run: cargo build --release -p localsend-cli

            - name: Upload CLI
              uses: actions/upload-artifact@v5
              with:
                  name: localsend-cli-linux-x64
                  path: rust/target/release/localsend-cli

    build-panel:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ./rust

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            - name: Build Panel
              run: cargo build --release -p relay-panel

            - name: Upload Panel
              uses: actions/upload-artifact@v5
              with:
                  name: relay-panel-linux-x64
                  path: rust/target/release/relay-panel

    build-windows:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Flutter SDK
              uses: subosito/flutter-action@v2.16.0
              with:
                  channel: stable
                  cache: true

            - name: Set up rust
              uses: dtolnay/rust-toolchain@stable

            # setup.dart shells out to `iscc` (package:innosetup).
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y

            - name: Build Prepare
              run: flutter pub get

            - name: Build Windows
              run: |
                  flutter build windows --release

            - name: Build iss script
              run: |
                  dart setup.dart
                  ls build\windows

            - name: Upload Windows
              uses: actions/upload-artifact@v5
              with:
                  name: windows-release
                  path: build\windows\localsend_rs-setup.exe
